name: validate

on:
  pull_request:
    paths:
      - "tasks/**"
      - "categories.yaml"
      - "registry.json"
      - "src/**"
      - "package*.json"
      - ".github/workflows/validate.yml"
  push:
    branches: [main]
    paths:
      - "tasks/**"
      - "categories.yaml"
      - "registry.json"
      - "src/**"
      - "package*.json"
      - ".github/workflows/validate.yml"

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # numpy:数值型任务(tops-fmri 等)的 Oracle solution.sh + exec-script grader 都用它算。
      - name: Install numerical grader dependency
        run: python3 -m pip install --disable-pip-version-check numpy
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: 单元测试(node --test)
        run: npm test
      - name: canary 检查
        run: node scripts/check-task-canary.mjs
      - name: 任务有效性 + Oracle/NOP 门
        run: node dist/cli.js validate all
      - name: registry 完整性(无 registry.json 时 cli 自身 exit 0)
        run: node dist/cli.js registry verify
