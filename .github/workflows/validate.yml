name: validate

on:
  pull_request:
    paths:
      - "tasks/**"
      - "categories.yaml"
      - "registry.json"
      - "src/**"
  push:
    branches: [main]
    paths:
      - "tasks/**"
      - "categories.yaml"
      - "registry.json"
      - "src/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # numpy:数值型任务(tops-fmri 等)的 Oracle solution.sh + exec-script grader 都用它算。
      # 走 apt 比 pip 快、稳定;文本/文档类任务不受影响(不 import 就不加载)。
      - name: 装 python 数值依赖(数值型 task 的 solution/grader 用)
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends python3-numpy
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: 单元测试(node --test)
        run: npm test
      - name: canary 检查
        run: node scripts/check-task-canary.mjs
      - name: 任务有效性 + Oracle/NOP 门
        run: node dist/cli.js validate all
      - name: registry 完整性(无 registry.json 时 cli 自身 exit 0)
        run: node dist/cli.js registry verify
