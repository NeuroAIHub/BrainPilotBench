name: validate

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "tasks/**"
      - "categories.yaml"
      - "registry.json"
      - "src/**"
      - "package*.json"
      - "README.md"
      - "CONTRIBUTING.md"
      - "scripts/**"
      - ".github/workflows/validate.yml"

permissions:
  contents: read

jobs:
  python-environment:
    name: Python environment (${{ matrix.os }}, ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Create documented tops-fMRI environment
        run: bash tasks/tops-fmri/env/setup-python.sh
      - name: Verify isolated numerical imports
        run: |
          .venv/bin/python -c 'import sys; assert sys.prefix != sys.base_prefix'
          .venv/bin/python -c 'import numpy, scipy, sklearn; print(numpy.__version__, scipy.__version__, sklearn.__version__)'
      - name: Verify bciciv-2a preprocessing contract
        run: .venv/bin/python -m unittest tasks/bciciv-2a/checks/test_preprocessing_contract.py

  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned numerical task dependencies
        run: python3 -m pip install --disable-pip-version-check -r tasks/neuro-rsc-place-cell/checks/requirements.txt
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Prepare Docker isolation smoke images
        if: runner.os == 'Linux'
        run: |
          docker pull alpine:3.20
          docker build -t bpb-inference-test:ci -f docker/inference/Dockerfile .
      - name: 单元测试(node --test)
        run: npm test
        env:
          BPB_DOCKER_TEST: ${{ runner.os == 'Linux' && '1' || '0' }}
          BPB_TEST_INFERENCE_IMAGE: ${{ runner.os == 'Linux' && 'bpb-inference-test:ci' || '' }}
      - name: Documentation command smoke test
        run: npm run test:docs
      - name: canary 检查
        run: node scripts/check-task-canary.mjs
      - name: 任务有效性 + Oracle/NOP 门
        run: node dist/cli.js validate all
      - name: registry 完整性(无 registry.json 时 cli 自身 exit 0)
        run: node dist/cli.js registry verify

  required:
    name: required
    if: always()
    needs: [python-environment, validate]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful validation jobs
        env:
          PYTHON_RESULT: ${{ needs.python-environment.result }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
        run: |
          test "$PYTHON_RESULT" = success
          test "$VALIDATE_RESULT" = success
