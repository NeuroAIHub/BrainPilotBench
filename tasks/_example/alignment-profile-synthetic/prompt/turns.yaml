- send: |-
    使用提供的 alignment profile 工具分析本地合成分数表。
    先阅读 PROFILE_CONTEXT.json、PROFILE_PROTOCOL.json 和 PROFILE_CONTRACT.md，再回答四个问题：
    Q1：整体层曲线形态是什么？报告全层均值、最高层、近优层、极差和描述性形态。
    Q2：开发集最高均值层相对预设最后层的差异有多大？报告受试者配对差异和描述性证据。
    Q3：群体平均分数最高的层，在各受试者中是否也接近最优？报告每位受试者的最高层、
    近优层集合及群体所选层距其最高分的差距；逐一移除受试者后重新汇总，检查选层结论
    是否对某位受试者敏感。区分层号变化与超过近优阈值的变化，不预设受试者差异很小。
    这检查已有受试者的一致性和移除敏感性，不是未见受试者泛化，也不能排除多人共同影响。
    Q4：在开发材料上固定选层后，该层在同一批受试者、未参与选层的确认材料上，是否仍
    保持相对最后层的优势？报告开发/确认差值、差值变化、确认分数及距确认最高观测分数
    的差距；分别判断“相对基线优势保持”和“接近确认集最佳”。没有确认材料须回答未评价。
    可以查看所有开发层；在查看确认材料前先 commit_selection，之后不能换层。
    遵循协议的描述性工程规则，不把阈值说成显著性或等价性，不把新材料验证称为真实 OOD。
    提交 answers.json（每个答案引用服务生成的 run_id）和 report.md。
    本任务只测试接口、计算和证据核验，不含真实脑数据，也不需要下载任何文件。
  then: wait_idle
