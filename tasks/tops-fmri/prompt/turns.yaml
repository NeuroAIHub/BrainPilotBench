# Single-turn prompt for tops-fmri. Adapted from the source repository's prompt.md.
# References to local private_eval paths are omitted because the Agent workspace contains no
# held-out data; those details belong only to the scorer contract.
- send: |
    You are an expert in machine-learning-based brain decoding. Complete an fMRI functional-connectivity signature task under a strict external-validation paradigm.

    ## Public data paths

    The working directory contains:

    ```text
    public_data/
      atlas/
        Fan_et_al_atlas_r279_MNI_2mm.nii
        Fan_et_al_atlas_r279_MNI_3mm.nii
        cluster_Fan_Net_r279.mat
      example_participant/
        FC/example_dFC_binned_task-CAPS.mat
        FC/example_dFC_binned_task-REST.mat
        ROI/example_ROI_mean_timeseries_task-CAPS.mat
        ROI/example_ROI_mean_timeseries_task-REST.mat
        pain_rating/example_pain_rating_task-CAPS.mat
        pain_rating/example_pain_rating_task-REST.mat
      whole_participants/FC_and_pain/study3_train.mat
    ```

    `public_data/whole_participants/FC_and_pain/study3_train.mat` contains only the following top-level MATLAB key:

    ```text
    Study3
    ```

    Study3 fields:

    ```text
    Study3.dfc_5bin_dat.{REST,CAPS,QUIN,ODOR}
    Study3.pain_5bin_dat.{REST,CAPS,QUIN,ODOR}
    Study3.dfc_10bin_dat.{REST,CAPS,QUIN,ODOR}
    Study3.pain_10bin_dat.{REST,CAPS,QUIN,ODOR}
    Study3.dfc_avg_dat.{REST,CAPS,QUIN,ODOR}
    Study3.pain_avg_dat.{REST,CAPS,QUIN,ODOR}
    ```

    Recommended primary training data:

    ```text
    Study3.dfc_5bin_dat.REST / CAPS: one (38781, 5) matrix per subject
    Study3.pain_5bin_dat.REST / CAPS: one (5, 1) rating vector per subject
    ```

    Each FC vector contains 38,781 edges corresponding to the upper-triangular edges among 279 ROIs:

    ```text
    279 * 278 / 2 = 38781
    ```

    If you find unexpected field shapes, document them in the report.

    ## Private external-validation interface

    The following information is provided only so that you can **write a general-purpose inference script**. Private features and labels will **not** appear in your workspace. During scoring, the benchmark platform will invoke your submitted script with its own features directory.

    The benchmark platform will run:

    ```bash
    python3 artifacts/scripts/apply_signature.py \
      --eval-features-dir <EVAL_FEATURES_DIR> \
      --model-dir artifacts/models \
      --out-dir <PREDICTIONS_DIR>
    ```

    `<EVAL_FEATURES_DIR>` is a temporary directory containing features only:

    ```text
    <EVAL_FEATURES_DIR>/study4_features.npz
    <EVAL_FEATURES_DIR>/study5_features.npz
    ```

    **Your script will not receive labels.** Do not attempt to read `labels/`, any `study4_labels*` or `study5_labels*` file, or any path outside the workspace from either the training or inference script.

    Keys and array shapes in `study4_features.npz`:

    ```text
    SBP_SP    -> (70, 38781)
    SBP_REST  -> (53, 38781)
    CBP_SP    -> (25, 38781)
    CBP_REST  -> (20, 38781)
    ```

    Keys and array shapes in `study5_features.npz`:

    ```text
    JP -> (63, 38781)
    UK -> (34, 38781)
    ```

    Note that the Study5 feature file exposes only the site keys `JP` and `UK`; it does not expose CBP/HC group field names. The benchmark platform keeps the Study5 labels private.

    The private feature matrices may contain a small number of NaN values. `apply_signature.py` must handle non-finite values using a fixed rule that does not depend on Study4/5 labels. For example, after `input_transform`, use `np.nan_to_num(..., nan=0.0, posinf=0.0, neginf=0.0)`, or use an imputation rule determined entirely from the Study3 training data. Do not refit an imputer, scaler, or PCA on private evaluation X.

    ## Final signature contract

    The final submission must be a linear edge-space connectivity signature.

    On Study3, you may try PCR, ridge regression, elastic net / lasso, PLS regression, robust regression, stability selection, subject-level bagging, an ensemble of linear models across seeds, or any other method that can be reduced to 38,781 linear edge-space weights.

    Regardless of the training procedure, the model used for benchmark external validation must be mathematically equivalent to:

    ```text
    signature_response = transformed_x @ w_raw + b_raw
    ```

    where:

    - `x` is the raw FC edge vector with shape `(38781,)`.
    - `transformed_x` must remain an edge vector with shape `(38781,)`.
    - `transformed_x` may only be:
      - `x` itself, or
      - an element-wise Fisher-z / `arctanh` transform of `x`, clipped to a finite range for numerical stability.
    - NaN/inf values must be handled with a fixed rule independent of private labels, and the final `signature_response` must be a finite scalar.
    - `w_raw` must be a one-dimensional vector with shape `(38781,)`.
    - `b_raw` must be a scalar.
    - The edge order in `w_raw` must match the 38,781-edge order of the input features.

    ## FC edge-order validation

    Before training and exporting the final signature, determine the edge ordering of the 38,781-dimensional FC features.

    1. Do not simply assume that the input order equals:

       ```python
       np.triu_indices(279, k=1)
       ```

    2. Preferentially determine edge ordering from the correspondence between:
       - `example_participant/ROI/` and `example_participant/FC/`.

    3. At minimum, test the following candidate orderings:

       - upper triangle, row-major, `i < j`;
       - upper triangle, MATLAB column-major;
       - lower triangle, MATLAB column-major;
       - the ordering actually used by MATLAB `squareform` or the local generation code.

    4. Save the validation procedure and results to:

       ```text
       results/edge_order_validation.json
       ```

       The file must record at least:

       - candidate orderings tested;
       - the consistency metric between each candidate ordering and the example FC;
       - the final edge ordering used;
       - the evidence supporting that choice;
       - whether individual edges can be mapped reliably to specific ROI pairs.

    5. `w_raw` must preserve exactly the same order as the Study3 input features.

    6. `scripts/apply_signature.py` must compute responses directly from the existing column order of the input features and must not reorder edges in private evaluation features.

    7. In `signature_manifest.json`, `edge_order` must contain the ordering established by validation. Use the following value only after it has been confirmed:

       ```json
       "upper_triangle_row_major_i_lt_j"
       ```

    8. If you cannot determine the specific ROI-pair order:

       - you may still train and perform inference in the original feature order;
       - you must not interpret individual weights anatomically or at the ROI-pair level;
       - use the following value in `signature_manifest.json`:

         ```json
         "source_feature_order_preserved_but_roi_mapping_unverified"
         ```

       - state this limitation explicitly in `report.md`.

    Permitted strategies include, but are not limited to:

    - PCR, with the PCA/regression pipeline reduced equivalently to a 38,781-dimensional `w_raw`;
    - linear models such as ridge, elastic net, lasso, or PLS;
    - linear signatures trained on multiple subject splits, seeds, or bootstrap samples, followed by averaging `w_raw` and `b_raw`;
    - feature filtering or stability selection, provided the final output is still a complete 38,781-dimensional `w_raw`, with zero weights for unselected features.

    The final external-validation model must not be a black-box model that cannot be reduced to 38,781 edge weights. Disallowed examples include:

    - random forest / XGBoost / kernel SVM;
    - neural networks;
    - kNN;
    - any nonlinear ensemble;
    - transductive methods that refit, reselect features, or re-estimate PCA/scalers on private evaluation X.

    You may compare such methods during exploration, but the final submitted signature and `apply_signature.py` must generate the external-validation response using only the submitted 38,781-dimensional linear signature.

    ## Required inference-script interface

    Submit:

    ```text
    scripts/apply_signature.py
    ```

    **The script must produce:**

    ```text
    <PREDICTIONS_DIR>/study4_predictions.csv
    <PREDICTIONS_DIR>/study5_predictions.csv
    ```

    `study4_predictions.csv` must contain these columns:

    ```csv
    condition,sample_id,signature_response
    ```

    Requirements:

    - `condition` must be one of `SBP_SP`, `SBP_REST`, `CBP_SP`, or `CBP_REST`.
    - Within each condition, `sample_id` must be consecutive integers from 0 to n-1.
    - Rows may appear in any order, but `sample_id` must correspond to the row index in the input feature matrix.

    `study5_predictions.csv` must contain these columns:

    ```csv
    site,sample_id,signature_response
    ```

    Requirements:

    - `site` must be either `JP` or `UK`.
    - Within each site, `sample_id` must be consecutive integers from 0 to n-1.
    - Rows may appear in any order, but `sample_id` must correspond to the row index in the input feature matrix.

    Your script must not output Study4 r, Study5 AUC, or the final score; the benchmark platform computes these privately.

    To keep the benchmark scorer portable, `scripts/apply_signature.py` may depend only on the Python standard library and `numpy`. Do not use `pandas`, `sklearn`, `joblib`, `scipy`, or any other non-standard runtime dependency in the inference script. Training scripts may use additional dependencies, but the final external-validation entry point must remain lightweight and directly executable.

    ## Required model format

    Submit:

    ```text
    models/study3_signature_weights.npz
    models/signature_manifest.json
    ```

    `study3_signature_weights.npz` must contain:

    ```text
    w_raw: shape (38781,)
    b_raw: scalar
    ```

    `signature_manifest.json` must contain:

    ```json
    {
      "n_rois": 279,
      "n_edges": 38781,
      "edge_order": "verified_edge_order",
      "input_transform": "none_or_fisher_z",
      "response_direction": "higher_means_more_pain",
      "training_method": "PCR/ridge/elastic_net/PLS/etc",
      "study3_split_strategy": "subject_level_split_description",
      "weights_are_averaged_over_splits_or_seeds": true
    }
    ```

    In this manifest:

    - replace `edge_order` with the value established in `results/edge_order_validation.json`;
    - if the ROI-pair order cannot be established reliably but the original feature order is preserved, use `source_feature_order_preserved_but_roi_mapping_unverified`.

    Do not rely on pickle/joblib as the only model format. You may additionally save the training pipeline for reproducibility, but external validation must run using only `w_raw`, `b_raw`, `signature_manifest.json`, and `apply_signature.py`.

    ## Study3 training and model-selection requirements

    1. Train the tonic-pain signature using the Study3 CAPS and REST conditions.
    2. Prefer `dfc_5bin_dat` and `pain_5bin_dat`.
    3. Perform internal held-out testing in Study3 using subject-level splits. Different time bins from the same subject must not appear in both training and test sets.
    4. Base all hyperparameter, preprocessing, and model choices only on Study3 training/validation data or Study3 internal held-out results.
    5. Do not use externally pretrained signature weights.
    6. Do not adjust the model using any Study4/5 feedback.

    Report at least the following internal Study3 results:

    - overall Pearson r: predicted versus true pain ratings across all held-out test bins;
    - within-subject mean r: within each held-out subject, correlate predictions with true ratings across CAPS+REST bins, then report the mean across subjects;
    - CAPS-versus-REST forced-choice accuracy: whether the mean CAPS response exceeds the mean REST response for each held-out subject;
    - response-direction check: whether the mean CAPS response exceeds the mean REST response;
    - at least one baseline, such as mean CAPS FC minus mean REST FC, or a simple ridge/PCR baseline.

    If time permits, use subject splits from at least three random seeds, report mean and standard deviation, and select a stable signature with a consistent response direction rather than optimizing a single split.

    ## Final deliverables

    Save the artifacts in the current working directory using this structure:

    ```text
    report.md
    models/study3_signature_weights.npz
    models/signature_manifest.json
    scripts/apply_signature.py
    scripts/*.py
    results/study3_train_test_results.csv
    results/edge_order_validation.json
    results/model_card.json
    ```

    `results/model_card.json` must contain:

    ```json
    {
      "final_model": "method_name",
      "input_transform": "none_or_fisher_z",
      "n_edges": 38781,
      "study3_split_seed_or_seeds": [42],
      "study3_overall_r": 0.0,
      "study3_within_subject_mean_r": 0.0,
      "study3_caps_vs_rest_accuracy": 0.0,
      "signature_weight_file": "models/study3_signature_weights.npz",
      "inference_script": "scripts/apply_signature.py"
    }
    ```

    `report.md` must describe:

    - Study3 data loading and subject-level splitting;
    - the training method and model-selection rationale;
    - `w_raw`, `b_raw`, `input_transform`, and edge ordering;
    - the edge-order validation method, evidence, and result;
    - if the ROI-pair order cannot be established reliably, an explicit statement that only the original feature order is preserved and that individual connections must not be interpreted anatomically;
    - how to run `scripts/apply_signature.py`, its output format, and confirmation that inference does not reorder edges;
    - Study3 held-out results and baseline comparisons;
    - an explicit statement that the benchmark platform evaluates Study4/Study5 privately, that you did not access their labels or final metrics during task execution, and that you did not submit Study4/Study5 r, AUC, or score values.
  then: wait_idle
