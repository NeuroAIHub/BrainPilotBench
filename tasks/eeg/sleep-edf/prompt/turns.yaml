    "send": "You are a deep-learning architect for sleep-staging on EEG. Design a PyTorch model that classifies 30-second single-channel Fpz-Cz sleep epochs into 5 sleep stages on the Sleep-EDF Cassette benchmark.\n\n## Input / output shape contract\n\nThe model's `forward` input tensor shape is fixed to:\n\n    (Batch, 1, 3000)\n\nwhere:\n- 1 is the single Fpz-Cz EEG channel\n- 3000 is the number of time points in a 30 s sleep epoch at 100 Hz\n- input amplitudes are expressed in microvolts (µV)\n\nThe `forward` output tensor shape must be exactly:\n\n    (Batch, 5)\n\ncorresponding to the five stages, in this channel order:\n\n    Wake, N1, N2, N3, REM\n\n## Dataset and split\n\n- Dataset: Sleep-EDF Expanded — Sleep Cassette\n- Subjects: 20 (subject 0–19; two PSG + Hypnogram recordings per subject, except subject 13 which has one)\n- **Agent-visible data directory: `./public_data/`** (relative to your workspace; `env/setup-agent.sh` unpacks it from the pinned HF release)\n  - Recordings: `public_data/sleep-cassette/SC4nn[0-9]E0-PSG.edf` and matching `-Hypnogram.edf` for subjects 0-15 (62 files total)\n  - Split manifests: `public_data/manifests/{subjects.json,default_split.json,loso_folds.json}`\n  - Loader: `public_data/get_fold_data.py` (contains zero-leakage asserts and both split loaders)\n  - Label mapping: `public_data/label_mapping.json`\n- **Subject 16-19 data does not appear in your workspace.** The scorer reads the four private test subjects (PSG + Hypnogram) from an isolated evaluator-only directory.\n\nThe fixed benchmark split is subject-boundary strict (zero leakage):\n\n| Split | Subjects | Count | Visibility |\n|-------|----------|-------|------------|\n| Train | 0–13 | 14 | public |\n| Val   | 14–15 | 2 | public |\n| Test  | 16–19 | 4 | private (scorer-only) |\n\nExample split loading:\n\n    from get_fold_data import get_default_split\n\n    split = get_default_split()\n    # split['train_subjects']=[0..13], split['val_subjects']=[14,15]\n    # split['test_subjects']=[16..19]  # scorer-only mirror; not staged in your workspace\n\nThe manifest also exposes 20-fold LOSO (`get_fold_data(fold_id)`); it is not used by the primary metric and its supplementary recordings are opt-in (`BPB_SLEEP_EDF_INCLUDE_LOSO=1` on setup). Do not use subjects 16-19 for training or validation under the default split — they are the held-out benchmark test set.\n\n## Frozen preprocessing\n\nThe scorer uses the expert preprocessing configuration below. **Design the model only; do not change these parameters, and do not redo any preprocessing inside the model code:**\n\n    def get_optimal_sleep_preprocessing():\n        return {\n            \"eeg_channels\": [\"EEG Fpz-Cz\"],\n            \"l_freq\": 0.3,\n            \"h_freq\": 35.0,\n            \"resample_sfreq\": 100,\n            \"input_unit\": \"microvolts\",\n            \"window_size_s\": 30,\n            \"crop_wake_mins\": 30,\n            \"n_classes\": 5,\n            \"mapping\": {\n                \"Sleep stage W\": 0,\n                \"Sleep stage 1\": 1,\n                \"Sleep stage 2\": 2,\n                \"Sleep stage 3\": 3,\n                \"Sleep stage 4\": 3,\n                \"Sleep stage R\": 4,\n            },\n        }\n\nLabel mapping notes:\n\n- Sleep stage 3 and Sleep stage 4 are merged into N3 (label 3), matching the AASM convention.\n- `Movement time` and `Sleep stage ?` epochs are discarded.\n- `crop_wake_mins=30` trims Wake epochs at head and tail to at most 30 minutes each, so the training distribution is not dominated by lights-off/lights-on wake.\n\nDo not redefine the label mapping inside the model. The five output logits correspond directly to labels 0..4.\n\n## Deliverable\n\nWrite a PyTorch `nn.Module` named `SleepAgentModel` for 5-class sleep staging. Save it in your workspace at:\n\n    EEG_sleep/sleep_agent_model.py\n\n(The BPB workspace is your current cwd; it is not `/workspace/`.)\n\nHard requirements:\n\n1. The file path must be exactly `EEG_sleep/sleep_agent_model.py`.\n2. The class name must be exactly `SleepAgentModel`.\n3. `forward(x)` must accept `x = torch.randn(2, 1, 3000)`.\n4. `forward` output shape must be exactly `torch.Size([2, 5])`.\n5. **The model file must not perform training, evaluation, data I/O, or file writes.** Top-level code must be pure declaration; the scorer will `import` the module and call `SleepAgentModel()` itself. Do not trigger training inside `if __name__ == '__main__'` either.\n6. No private dependencies. Beyond `torch` and `numpy`, do not import any third-party package.\n7. **Do not directly reuse braindecode's prebuilt sleep-staging models** (DeepSleepNet, TinySleepNet, SleepStagerChambon2018, U-Time, U-Sleep, etc.). You may borrow ideas or reimplement them, but not `from braindecode.models import SleepStagerChambon2018` and wrap it.\n8. Do not read subject 16-19 data and do not include those subjects in training or validation. The scorer holds them separately.\n9. Emit Python code only. Do not include Markdown, explanatory prose, or prompt paraphrases in `sleep_agent_model.py`; `importlib` will fail.\n\n## Model design hints\n\n1. **Temporal modeling**: use temporal convolutions that cover the delta / theta / alpha / sigma / low-beta timescales relevant to sleep-stage discrimination.\n2. **Multi-scale features**: multiple parallel kernel widths (e.g. small + large receptive fields) often help.\n3. **Stage-transition prior**: even though `forward` sees only a single 30 s epoch, you can encode transition regularity via dilated convolutions / TCN / lightweight temporal modules.\n4. **Regularization**: use BatchNorm / Dropout / Pooling sensibly; keep the parameter count modest.\n5. **Class imbalance**: N1 is by far the rarest stage and typically the hardest. The scorer applies class-weighted cross-entropy during training, but architectural choices (e.g. attention on rare-stage-friendly features) can still help.\n\n## Report requirements\n\nIn addition to `EEG_sleep/sleep_agent_model.py`, produce at the workspace root:\n\n    report.md\n\nCovering at least:\n\n- A summary of the model architecture (layers, parameter-count estimate, design trade-offs).\n- Why you chose this architecture (which of the design hints above it addresses).\n- Known limitations and problems you could not resolve.\n\nThe scorer will train a single `SleepAgentModel` instance on subjects 0-13, use subjects 14-15 for validation-based early stopping (Adam lr=1e-3, batch=64, up to 20 epochs, class-weighted cross-entropy, patience=5 on val loss), then evaluate on subjects 16-19 and report:\n\n- test_kappa (**primary metric**, Cohen's kappa — standard for sleep-staging with heavy class imbalance)\n- test_accuracy / test_balanced_accuracy / test_macro_f1 (auxiliary aggregates)\n- wake_recall / n1_recall / n2_recall / n3_recall / rem_recall (per-class recall on subjects 16-19)\n\nThe scorer uses the private subject-16-19 Hypnogram files for all metrics; the agent never sees them or the final score.",
