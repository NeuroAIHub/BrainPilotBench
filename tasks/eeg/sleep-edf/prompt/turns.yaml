# conventions aligned to BPB (the agent works in its own workspace, not in
# /workspace/; private subject-16-19 data lives on the scorer side, never
# in the agent's `public_data/`). The core contract is unchanged: the agent
# submits a generic PyTorch nn.Module class; the scorer trains once on
# subjects 0-13 (with val 14-15) and blind-tests on 16-19.
