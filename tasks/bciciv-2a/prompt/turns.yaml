# prompt/turns.yaml — bciciv-2a single-turn prompt.
# Adapted from the source task's decoder_prompt.md, with paths and workspace
# conventions aligned to BPB (the agent works in its own workspace, not in
# /workspace/; private session-E data lives on the scorer side, never in the
# agent's `public_data/`). The core contract is unchanged: the agent submits
# a generic PyTorch nn.Module class; the scorer trains and evaluates on
# every subject.
[
  {
    "send": "You are a deep-learning architect for EEG motor imagery decoding. Design a PyTorch model that performs 4-class motor imagery decoding on the frozen preprocessed BCI Competition IV 2a benchmark data.\n\n## Input / output shape contract\n\nThe model's `forward` input tensor shape is fixed to:\n\n    (Batch, 22, 512)\n\nwhere:\n- 22 is the number of EEG channels (EOG excluded; the channel names are listed under `get_preprocessing_contract` below)\n- 512 is the number of time points in the cue-relative half-open MI window `[0, 4 s)` at 128 Hz\n- input amplitudes are expressed in microvolts (µV)\n\nThe `forward` output tensor shape must be exactly:\n\n    (Batch, 4)\n\ncorresponding to the four classes, in this channel order:\n\n    left_hand, right_hand, feet, tongue\n\n## Dataset and split\n\n- Dataset: BCI Competition IV Dataset 2a (Graz)\n- Subjects: 9 (subject 1–9, files `A01`–`A09`)\n- **Agent-visible data directory: `./public_data/`** (relative to your workspace; `env/setup-agent.sh` unpacks it from the pinned HF release)\n  - Training-session GDF: `public_data/gdf/A01T.gdf` … `A09T.gdf` (9 files)\n  - Split manifests: `public_data/manifests/subjects.json` and `public_data/manifests/protocol.json`\n  - Loader: `public_data/get_subject_data.py` (contains zero-leakage asserts)\n  - Label mapping: `public_data/label_mapping.json`\n- **The private session-E data never appears in your workspace.** The scorer reads `A0xE.gdf` and the ground-truth `A0xE.mat` files from an isolated evaluator-only directory.\n\nThe protocol is **within-subject cross-session**: each subject is trained and evaluated independently, and the scorer builds a fresh model instance per subject.\n\n| Split | Session | MOABB name | File | Trials | Purpose |\n|-------|---------|------------|------|--------|---------|\n| Train | T | `0train` | `A0xT.gdf` | 230 | Model training |\n| Val   | T | `0train` | `A0xT.gdf` | 58  | Early stopping / model selection |\n| Test  | E | `1test`  | `A0xE.gdf` | 288 | Scorer-only blind test; not visible to the agent |\n\nNotes:\n- Session T has 288 labeled trials; a fixed stratified 80/20 split inside T (seed=42) yields train/val. The split indices are stored under `public_data/manifests/subjects.json` at `val_split.train_trial_indices` and `val_trial_indices`; **the scorer uses exactly the same indices**.\n- Session E is not used for training, validation, or hyperparameter tuning at any point.\n- Class balance: 72 trials per class per session.\n- When classifying MOABB session names, always test for `test` before `train`, because `1test` ends with the letter `t`.\n\nExample split loading:\n\n    from get_subject_data import get_subject_data\n\n    split = get_subject_data(subject_id=1)\n    # train_trial_indices: 230 T-session trials of A01T.gdf\n    # val_trial_indices:   58  T-session trials of A01T.gdf\n    # test is 288 trials of A01E.gdf and is not visible to the agent\n\n## Frozen preprocessing\n\nThe scorer uses the frozen preprocessing contract below. **Design the model only; do not change these parameters, and do not redo any preprocessing inside the model code:**\n\n    def get_preprocessing_contract():\n        eeg_channels = [\n            \"Fz\", \"FC3\", \"FC1\", \"FCz\", \"FC2\", \"FC4\",\n            \"C5\", \"C3\", \"C1\", \"Cz\", \"C2\", \"C4\", \"C6\",\n            \"CP3\", \"CP1\", \"CPz\", \"CP2\", \"CP4\",\n            \"P1\", \"Pz\", \"P2\", \"POz\",\n        ]\n        return {\n            \"channels\": eeg_channels,\n            \"bandpass_hz\": (4, 38),\n            \"resample_hz\": 128,\n            \"epoch_anchor\": {\"T\": \"769-772\", \"E\": \"783\"},\n            \"epoch_window_s\": \"[0, 4)\",\n            \"input_unit\": \"microvolts\",\n        }\n\nThis follows MOABB BNCI2014_001 cue timing and array-unit semantics. The 512-sample half-open endpoint is benchmark-specific: literal MNE/MOABB `tmax=4.0` is inclusive and yields 513 samples.\n\nLabel mapping (consistent with the benchmark):\n\n| Class | Label |\n|-------|-------|\n| left_hand | 1 |\n| right_hand | 2 |\n| feet | 3 |\n| tongue | 4 |\n\nDo not redefine the label mapping inside the model. The scorer maps labels 1..4 directly to output class indices 0..3 (i.e. `label - 1`) in the same order the four output logits are read.\n\n## Deliverable\n\nWrite a PyTorch `nn.Module` named `MIAgentModel` for 4-class motor imagery decoding. Save it in your workspace at:\n\n    EEG_MI/mi_agent_model.py\n\n(The BPB workspace is your current cwd; it is not `/workspace/`.)\n\nHard requirements:\n\n1. The file path must be exactly `EEG_MI/mi_agent_model.py`.\n2. The class name must be exactly `MIAgentModel`.\n3. `forward(x)` must accept `x = torch.randn(2, 22, 512)`.\n4. `forward` output shape must be exactly `torch.Size([2, 4])`.\n5. **The model file must not perform training, evaluation, data I/O, or file writes.** Top-level code must be pure declaration; the scorer will `import` the module and call `MIAgentModel()` itself. Do not trigger training inside `if __name__ == '__main__'` either.\n6. No private dependencies. Beyond `torch` and `numpy`, do not import any third-party package.\n7. **Do not directly reuse braindecode's prebuilt decoders**, e.g. `EEGNet`, `ShallowFBCSPNet`, `Deep4Net`, `EEGConformer`. You may borrow ideas or reimplement them from scratch, but not `from braindecode.models import EEGNet` and wrap it.\n8. Do not read session-E data (`A0xE.gdf`) and do not include session-E in training or validation. The scorer holds session E separately.\n9. Emit Python code only. Do not include Markdown, explanatory prose, or prompt paraphrases in `mi_agent_model.py`; `importlib` will fail.\n\n## Model design hints\n\n1. **Spatiotemporal modeling**: exploit both the spatial topology (22 channels) and the temporal dynamics (512-point MI window).\n2. **Frequency-band prior**: the task-relevant band is roughly 4–38 Hz, with mu (~ 8–12 Hz) and beta (~ 13–30 Hz) especially informative.\n3. **Lateralization for hands**: C3 vs. C4 contralateral dominance is a strong cue; feet vs. tongue tend to show distinct midline / central-parietal patterns.\n4. **Regularization for small samples**: each subject has only ~230 training trials, so keep the parameter count modest and use BatchNorm / Dropout / capacity control sensibly.\n5. **Cross-session generalization**: training uses only session T, evaluation uses session E; avoid overfitting to single-day noise.\n\n## Report requirements\n\nIn addition to `EEG_MI/mi_agent_model.py`, produce at the workspace root:\n\n    report.md\n\nCovering at least:\n\n- A summary of the model architecture (layers, parameter-count estimate, design trade-offs).\n- Why you chose this architecture (which of the design hints above it addresses).\n- Known limitations and problems you could not resolve.\n\nThe scorer will train the same `MIAgentModel` class from scratch for each subject (Adam, lr=1e-3, batch=64, up to 100 epochs, early stopping with patience=20 on val loss), evaluate on the 288 session-E trials, and report:\n\n- mean_kappa (**primary metric**, the BCI Competition IV convention)\n- mean_accuracy / mean_macro_f1 (auxiliary metrics)\n- subject_x_acc / subject_x_kappa for x in {1..9} (per-subject detail)\n\nThe scorer uses the private `A0xE.mat` ground-truth labels for all metrics; the agent never sees the labels or the final score.",
    "then": "wait_idle"
  }
]
