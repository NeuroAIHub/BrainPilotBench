# Turn 1: provide all five subtasks and the complete artifact contract at once.
# Data is staged under ./data/ by env/setup.sh.
- send: |
    Using `./data/VRBeltReframe.mat`, complete an analysis of place-cell dynamics in the retrosplenial cortex (RSC).
    Experimental paradigm: a mouse running on a 90 cm virtual-reality belt during two-photon Ca²⁺ imaging.
    Top-level keys in the MAT file:
      - deconv_all       One cell array per session containing deconvolved neural activity (cells × frames or frames × cells)
      - behavior_vr_all  One behavioral struct per session (pos_norm / trial / optional ts)
      - tcs_all          Imaging timestamps (optional; for temporal alignment)

    Complete all of the following subtasks:
      1) Place-cell screening: retain running frames using a speed threshold of ≥1 cm/s; compute
         occupancy-normalized rate maps; construct a null distribution by circularly shifting activity
         within each trial (500 shuffles recommended); classify a cell as a place cell when its observed
         spatial information exceeds the (1 - place_alpha) quantile of that cell's null distribution.
         Use place_alpha=0.025 by default.
      2) Visualize representative single cells and the sorted population rate map (sorted by peak position).
      3) Position decoding: use Poisson Naive Bayes with 50 spatial bins and five-fold cross-validation
         split by complete trials (not by frames). Construct a null distribution with 500 trial-wise
         circular shuffles and report a one-sided empirical p-value.
      4) Trial-bin correlation analysis: characterize consistency and correlation structure in the
         trial × spatial-bin matrix.
      5) Firing-rate dynamics: analyze activity drift across trials and within sessions.

    Submit every artifact below in the current workspace root:
      - benchmark_summary.json   Machine-readable results following ./checks/output_schema.json
      - report.md                Analysis report covering methods, results, and discussion, with figures cited
      - figures/*.png            All visualizations, covering at least subtasks 2, 4, and 5

    Required JSON fields used for automatic scoring (omitting any field makes the run unscored):
      cross_session_place_cell_stability.place_cell_ratio_mean   (float, [0,1])
      position_decoding_significance.decoding_significant        (bool)
      position_decoding_significance.real_median_decoding_error_cm (float, cm)
      position_decoding_significance.shuffle_median_decoding_error_cm (float, cm)

    Recommended settings: 90 cm VR track, 50 bins, five folds, 500 shuffles, and seed 7.
    Multi-session aggregation: take the median within each session and then the median across sessions,
    so that larger sessions do not dominate the result.
  then: wait_idle
